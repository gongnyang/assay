name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Shell syntax check
        run: |
          for f in skill/scripts/*.sh; do bash -n "$f"; done

      - name: README parity
        run: bash tests/readme-parity.sh

      - name: Shipping gate (install-gate.sh)
        run: bash skill/scripts/install-gate.sh skill

      - name: Smoke tests
        run: bash tests/smoke.sh

  live-reach-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Live Reach smoke (network only)
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_LIVE: '1'
        run: bash tests/smoke.sh

      - name: Report Codex-dependent coverage limitation
        if: always()
        run: |
          {
            echo '## Coverage limitation'
            echo 'This CI does not guarantee 3 Codex-dependent cases because GitHub Actions does not provide a logged-in Codex CLI:'
            echo '- live reach-refute aid 반환 계약'
            echo '- live reach-refute aid 불일치 거부'
            echo '- live g2-spawn → verdict-gate'
          } >> "$GITHUB_STEP_SUMMARY"
